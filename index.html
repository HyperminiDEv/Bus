<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Buses en el mapa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="field">
    <select id="company" aria-label="Empresa">
      <option value="">Todas</option>
    </select>
  </div>
  <button id="btnLocate" type="button" aria-label="Mi ubicación">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
  </button>
  <button id="btnLog" type="button" aria-label="Ver logs" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
</div>

<div class="status" role="status" aria-live="polite">
  <span id="dot" class="dot load"></span>
  <span id="statusText">Cargando…</span>
</div>

<section id="logpanel" aria-label="Logs" aria-hidden="true">
  <header>
    <b>Logs</b>
    <button id="logCopy" type="button">Copiar</button>
    <button id="logClear" type="button">Limpiar</button>
    <button id="logClose" type="button">Cerrar</button>
  </header>
  <div id="logbody"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
